spring.application.name=news-aggregator

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/newsdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.docker.compose.enabled=false

#JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#Port
server.port=8080

#Redis
spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}
spring.cache.type=redis

# NewsAPI
newsapi.key=${NEWSAPI_KEY}
newsapi.url=https://newsapi.org/v2
newsapi.categories=technology,sports,business,health,entertainment

# RSS Feeds
rss.feeds=http://feeds.bbci.co.uk/news/rss.xml,https://feeds.feedburner.com/ndtvnews-top-stories,https://timesofindia.indiatimes.com/rssfeedstopstories.cms

# Cache TTL settings
spring.cache.redis.time-to-live=900000
spring.cache.redis.cache-null-values=false

# Kafka Consumer
spring.kafka.consumer.group-id=news-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.listener.ack-mode=manual

# Kafka Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

#Debug logging for security (temporary, helps us diagnose)
logging.level.org.springframework.security=DEBUG