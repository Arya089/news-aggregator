spring.application.name=news-aggregator

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/newsdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:aryaAnita#22}
spring.docker.compose.enabled=false

#JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#Port
server.port=8080

#Redis
spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}
spring.cache.type=redis

# Cache TTL settings
spring.cache.redis.time-to-live=900000
spring.cache.redis.cache-null-values=false

# Kafka Consumer
spring.kafka.consumer.group-id=news-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

#Debug logging for security (temporary, helps us diagnose)
logging.level.org.springframework.security=DEBUG